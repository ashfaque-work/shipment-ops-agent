[project]
name = "shipment-ops-agent"
version = "0.1.0"
description = "AI shipping-operations assistant with a mock carrier, human-in-the-loop shipment creation, document extraction and an evaluation suite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
agent = [
    "openai>=1.40",
    "langgraph>=0.2.40",
    "mcp>=2.3,<3",
]
documents = [
    "reportlab>=4.2",
    "pypdf>=4.3",
    "pypdfium2>=4.30",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI dependency defaults (Depends/File) are idiomatic
