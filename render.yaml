# Render Blueprint: ONE free web service.
# DEMO_MODE runs the mock carrier inside the API process, so no second service is needed.
# (docker-compose keeps the two-service setup for local development.)
# Frontend goes on Vercel - see docs/DEPLOY.md.
services:
  - type: web
    name: shipops-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/python.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true" # mock carrier in-process + per-IP / daily request limits
      - key: TRUST_PROXY
        value: "true" # client IP from Render's X-Forwarded-For
      - key: MOCK_CLOCK
        value: now # fresh dates for a live demo (evals use a fixed clock)
      - key: LLM_PROVIDER
        value: groq
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DEMO_DAILY_REQUEST_CAP
        value: "400"
      - key: MAX_UPLOAD_MB
        value: "3"
      # Set these in the Render dashboard (never commit them):
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS # e.g. https://shipment-ops-agent.vercel.app
        sync: false
